<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hyden Art — Coming soon</title>
<meta name="description" content="Hand-painted Indian heritage wallpapers, wall decals and wall frames. Our website is coming soon.">
<link rel="icon" href="favicon.ico" sizes="32x32"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="The Hyden Art — Coming soon"><meta property="og:description" content="Hand-painted Indian heritage wallpapers, wall decals and wall frames.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f6efe2;--paper:#fbf7ef;--ink:#2d2a26;--pink:#d9577a;--blush:#f2c9c4;--terra:#c96f4a}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip}
body{background:var(--cream);color:var(--ink);font:400 17px/1.6 "DM Sans",system-ui,sans-serif;overflow-x:clip;min-height:100svh;display:flex;flex-direction:column}
img{display:block;max-width:100%}
h1{font-family:Fraunces,serif;font-weight:400;line-height:1.05;letter-spacing:-.01em}
.logo{font-family:Fraunces,serif;font-size:22px;text-decoration:none;color:inherit}
.logo b{font-weight:600;color:var(--pink)}
.top{max-width:1180px;width:100%;margin:0 auto;padding:28px 20px 0}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--paper);padding:13px 24px;border-radius:999px;font:500 15px "DM Sans";text-decoration:none;transition:transform .2s,background .2s}
.btn:hover{background:var(--pink);transform:translateY(-2px) rotate(-1.5deg)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.hero{flex:1;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:40px 20px 60px;max-width:1180px;width:100%;margin:0 auto}
.hero h1{font-size:clamp(46px,6.6vw,92px);margin-top:18px}
.hero h1 .swash{display:inline-block;font-style:italic;color:var(--pink);transform:rotate(-3deg)}
.hero p.lead{max-width:440px;margin:22px 0 30px;font-size:19px}
.frame-stack{position:relative;height:min(600px,70vh)}
.frame-stack figure{position:absolute;border-radius:200px 200px 14px 14px;overflow:hidden;border:8px solid var(--paper);box-shadow:0 30px 60px -25px rgba(80,40,20,.45);transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.frame-stack figure img{width:100%;height:100%;object-fit:cover}
.f1{width:58%;height:82%;right:6%;top:0;transform:rotate(3deg)}
.f2{width:44%;height:55%;left:0;bottom:0;transform:rotate(-6deg)}
.f3{width:30%;aspect-ratio:1;border-radius:50%!important;right:0;bottom:4%;transform:rotate(8deg)}
.frame-stack:hover .f1{transform:rotate(-1deg) translateY(-8px)}
.frame-stack:hover .f2{transform:rotate(-10deg) translateX(-10px)}
.frame-stack:hover .f3{transform:rotate(16deg) scale(1.06)}
.lotus{position:absolute;width:120px;left:-40px;top:-30px;z-index:3}
.lotus path{transform-origin:60px 80px;animation:bloom 1.6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes bloom{from{transform:rotate(0) scale(.2);opacity:0}}
.sticker{position:absolute;right:-6px;top:-16px;z-index:4;width:116px;height:116px;animation:spin 18s linear infinite}
.sticker text{font:700 12.5px "DM Sans";letter-spacing:.2em;fill:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;padding:10px 20px calc(40px + env(safe-area-inset-bottom));font-size:14px;color:#6f675e}
@media(max-width:860px){
  .hero{grid-template-columns:1fr;gap:56px;padding-top:28px}
  .frame-stack{height:min(440px,110vw);margin:0 10px}
  .lotus{width:84px;left:-14px;top:-24px}
  .sticker{width:92px;height:92px}
  .eyebrow{font-size:11.5px;letter-spacing:.12em;text-align:center}
  .hero .btn{display:flex;width:fit-content;margin:0 auto}
  .top{text-align:center}
  .hero{text-align:center}
  .hero p.lead{margin-left:auto;margin-right:auto}
  .frame-stack{width:min(420px,100%);margin:0 auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><a class="logo" href="/">the<b>hyden</b>.art</a></div>
<main class="hero">
  <div>
    <p class="eyebrow">Wallpapers · Wall decals · Wall frames</p>
    <h1>Our website is coming <span class="swash">soon.</span></h1>
    <p class="lead">Hand-painted-style lotuses, temple motifs and parrot gardens, turned into wallpaper you can actually live with. Made to order, shipped across India and worldwide.</p>
    <a class="btn" href="https://instagram.com/thehyden.art" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".6" fill="currentColor"/></svg>
      Follow @thehyden.art
    </a>
  </div>
  <div class="frame-stack">
    <svg class="lotus" viewBox="0 0 120 100" aria-hidden="true">
      <g fill="#d9577a" fill-opacity=".85">
        <path d="M60 80C40 60 40 30 60 8c20 22 20 52 0 72z"/>
        <path d="M60 80C35 70 20 45 24 22c22 8 36 34 36 58z" style="animation-delay:.15s"/>
        <path d="M60 80c25-10 40-35 36-58-22 8-36 34-36 58z" style="animation-delay:.15s"/>
        <path d="M60 80C30 80 10 64 4 46c24-4 46 10 56 34z" fill="#f2c9c4" style="animation-delay:.3s"/>
        <path d="M60 80c30 0 50-16 56-34-24-4-46 10-56 34z" fill="#f2c9c4" style="animation-delay:.3s"/>
      </g>
    </svg>
    <svg class="sticker" viewBox="0 0 116 116" aria-hidden="true"><defs><path id="c" d="M58 58m-44 0a44 44 0 1 1 88 0a44 44 0 1 1-88 0"/></defs><circle cx="58" cy="58" r="56" fill="#f2c9c4"/><text><textPath href="#c">COMING SOON · COMING SOON · </textPath></text><text x="50" y="66" style="font-size:22px;letter-spacing:0">🪷</text></svg>
    <figure class="f1"><img src="img/w04.jpg" alt="Floral heritage wallpaper behind a vanity with a pink dresser"></figure>
    <figure class="f2"><img src="img/w07.jpg" alt="Aranya mural with deer and palm trees on wardrobe doors"></figure>
    <figure class="f3"><img src="img/w12.jpg" alt="Close-up of a pink lotus from the Nabhi Kamalam artwork"></figure>
  </div>
</main>
<footer>© 2026 The Hyden Art</footer>
</body>
</html>
