<style>
:root{--ink:#2d2a26;--paper:#fff;--w2:#faf8f5;--w3:#f4f1ec;--w4:#efebe4;--gold:#7a4a2a;--line:rgba(45,42,38,.14);
  --display:"Newsreader",Georgia,serif;--sans:"Manrope","Helvetica Neue",Arial,sans-serif;--pad:clamp(18px,4vw,64px);--ease:cubic-bezier(.16,1,.3,1)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,figure,ul{margin:0;padding:0}ul{list-style:none}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 var(--pad);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:12px;font:500 22px/1 var(--display)}
.brand img{width:38px;height:38px}
.links{display:flex;gap:clamp(14px,2.2vw,32px);font:500 14px/1 var(--sans);letter-spacing:.03em}
.links a{padding:6px 0;border-bottom:1px solid transparent;transition:border-color .3s}
.links a:hover,.links a[aria-current]{border-color:currentColor}
.menu{display:none;font:600 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 var(--pad);transform:translateY(-100%);transition:transform .6s var(--ease)}
.sheet:not(.open){visibility:hidden;transition:transform .7s var(--ease),visibility 0s .7s}
.sheet.open{transform:none}
.xb{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;padding:0;transition:background .2s}
.xb:hover{background:rgba(45,42,38,.07)}
.xb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}

.sheet a{font:400 clamp(36px,10vw,56px)/1.15 var(--display)}
.sheet .x{position:absolute;top:22px;right:var(--pad);font:600 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}

.head{padding:clamp(28px,3.4vw,52px) var(--pad) 0}
.kicker{font:600 12px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.head h1{font:400 clamp(44px,5.4vw,84px)/1.04 var(--display);letter-spacing:-.02em;margin-top:12px;padding-bottom:.08em}
.head p{max-width:34em;margin-top:6px;font-size:17px;color:rgba(45,42,38,.78)}
.cats{display:flex;gap:clamp(18px,3vw,40px);margin:clamp(22px,2.4vw,34px) var(--pad) 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;padding:0 0 14px;font:500 15px/1 var(--sans);letter-spacing:.02em;color:rgba(45,42,38,.6);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .3s,border-color .3s}
.cats a:hover{color:var(--ink)}
.cats a[aria-current]{color:var(--ink);border-color:var(--ink)}
.cats sup{font-size:11px;margin-left:4px;opacity:.6}
.subs{display:flex;flex-wrap:wrap;gap:8px;padding:18px var(--pad) 0}
.subs a{border:1px solid var(--line);border-radius:999px;padding:9px 16px 8px;font:500 14px/1 var(--sans);transition:background .3s,color .3s,border-color .3s}
.subs a:hover{border-color:var(--ink)}
.subs small{font-weight:400;margin-left:7px;opacity:.6}
.subs a[aria-current]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:clamp(28px,3vw,44px) clamp(14px,1.8vw,26px);padding:clamp(28px,3vw,44px) var(--pad) clamp(80px,9vw,140px)}
.card{text-align:left;display:block;width:100%}
.card figure{aspect-ratio:4/5;overflow:hidden;background:var(--w3);position:relative}
.card .alt{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease),transform 1.2s var(--ease)}
.card:hover .alt{opacity:1}
.card img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.card:hover img{transform:scale(1.035)}
.card b{display:block;font:400 clamp(22px,1.8vw,27px)/1.15 var(--display);margin-top:14px}
.card span{display:block;font:500 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:rgba(45,42,38,.55);margin-top:8px}
.card{opacity:0;transform:translateY(18px);animation:in .8s var(--ease) forwards}
@keyframes in{to{opacity:1;transform:none}}

.v{position:fixed;inset:0;z-index:120;background:var(--paper);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.v.open{opacity:1;visibility:visible;transition:opacity .35s}
.v-stage{position:relative;background:var(--w3);display:flex;align-items:center;justify-content:center;min-height:0;padding:clamp(16px,3vw,40px)}
.v-stage img{max-width:100%;max-height:calc(100svh - 2*clamp(16px,3vw,40px));object-fit:contain}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:var(--paper);box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:18px}
.v-prev{left:14px}.v-next{right:14px}
.v-side{display:flex;flex-direction:column;padding:clamp(24px,3vw,48px);overflow:auto}
.v-x{align-self:flex-end;font:600 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.v-side h2{font:400 clamp(36px,3.6vw,56px)/1.05 var(--display);margin-top:auto;padding-bottom:.08em}
.v-side .kicker{margin-top:24px}
.v-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}
.v-thumbs button{width:64px;height:64px;overflow:hidden;opacity:.55;outline:1px solid transparent;outline-offset:2px;transition:opacity .25s,outline-color .25s}
.v-thumbs button[aria-pressed="true"]{opacity:1;outline-color:var(--ink)}
.v-thumbs img{width:100%;height:100%;object-fit:cover}
.v-act{display:flex;flex-direction:column;gap:10px;margin-bottom:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:999px;font:600 15px/1 var(--sans);letter-spacing:.02em;transition:background .3s,color .3s}
.btn.wa{background:var(--ink);color:var(--paper)}.btn.wa:hover{background:var(--gold)}
.btn.ig{border:1px solid var(--ink)}.btn.ig:hover{background:var(--ink);color:var(--paper)}
.btn svg{width:18px;height:18px}
.btn.add{border:1px dashed rgba(45,42,38,.45)}.btn.add:hover{border-style:solid;border-color:var(--ink)}.btn.add.on{background:var(--w3);border-style:solid;border-color:var(--w3)}
.ico{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;transition:background .3s}
.ico:hover{background:var(--w3)}
.ico svg,.fav svg,.s-bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico b{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--paper);font:700 10px/18px var(--sans);text-align:center}
.navr{gap:2px;margin-left:clamp(10px,1.6vw,22px)}
.card{position:relative}
.card-o{display:block;width:100%;text-align:left}
.fav{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08);transition:transform .25s var(--ease),background .25s}
.fav:hover{transform:scale(1.08);background:#fff}
.fav svg{width:19px;height:19px}
.fav[aria-pressed="true"] svg,.ico.on svg{fill:var(--gold);stroke:var(--gold)}
.s{position:fixed;top:58px;right:var(--pad);z-index:125;width:min(480px,calc(100vw - 32px));max-height:min(72vh,600px);background:var(--paper);border:1px solid var(--line);box-shadow:0 20px 50px rgba(22,18,15,.16);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .25s var(--ease),visibility 0s .25s}
.s.open{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s var(--ease)}
.s-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.s-bar svg{width:19px;height:19px;flex:none;opacity:.7}
.s-bar input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 16px/1.4 var(--sans);color:var(--ink);padding:6px 0}
.s-bar input::placeholder{color:rgba(45,42,38,.45)}
.s-bar input::-webkit-search-cancel-button{display:none}
.s-x{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none;transition:background .2s}
.s-x:hover{background:var(--w3)}
.s-bar .s-x svg{width:16px;height:16px;opacity:1}
.s-res{overflow:auto;padding:10px}
.s-res p{color:rgba(45,42,38,.55);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:4px 6px 8px}
.s-cats{display:flex;flex-wrap:wrap;gap:6px;padding:4px}
.s-cats a{border:1px solid var(--line);border-radius:999px;padding:8px 14px 7px;font:500 13px/1 var(--sans);transition:border-color .3s}
.s-cats a:hover{border-color:var(--ink)}
.s-grid{display:flex;flex-direction:column;gap:2px}
.s-grid button{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;padding:6px;border-radius:10px;transition:background .2s}
.s-grid button:hover,.s-grid button:focus-visible{background:var(--w3)}
.s-grid figure{width:44px;aspect-ratio:4/5;overflow:hidden;background:var(--w3)}
.s-grid img{width:100%;height:100%;object-fit:cover}
.s-grid b{display:block;font:400 19px/1.15 var(--display)}
.s-grid span{display:block;font-size:12px;color:rgba(45,42,38,.6);margin-top:2px}
@media (max-width:600px){.s{right:16px;top:60px}}
.enq-n{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:9px 14px 8px;font:600 13px/1 var(--sans);letter-spacing:.04em;margin-left:clamp(14px,2vw,28px)}
.enq-n b{display:grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:11px}
.navr{display:flex;align-items:center}
.d{position:fixed;inset:0;z-index:130;visibility:hidden;transition:visibility 0s .5s}
.d.open{visibility:visible;transition:none}
.d-bg{position:absolute;inset:0;background:rgba(22,18,15,.35);opacity:0;transition:opacity .4s}
.d.open .d-bg{opacity:1}
.d-panel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100vw);background:var(--paper);display:flex;flex-direction:column;padding:clamp(22px,3vw,36px);transform:translateX(100%);transition:transform .5s var(--ease)}
.d.open .d-panel{transform:none}
.d-panel h2{font:400 40px/1.05 var(--display);margin:6px 0 22px;padding-bottom:.08em}
.d-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px}
.d-list li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center}
.d-list img{width:64px;height:80px;object-fit:cover}
.d-list b{display:block;font:400 22px/1.15 var(--display)}
.d-list span{font-size:13px;color:rgba(45,42,38,.6)}
.d-list button{font-size:13px;text-decoration:underline;text-underline-offset:3px;color:rgba(45,42,38,.7)}
.d-list .d-empty{display:block;color:rgba(45,42,38,.65)}
.d-act{display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid var(--line);margin-top:18px}
.d-act:empty{display:none}
.v-ig{font-size:14px;margin-top:16px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

footer{background:var(--w3);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding:28px var(--pad);font-size:14px;color:rgba(45,42,38,.75)}
@media (max-width:1000px){.links{display:none}.menu{display:block}}
@media (max-width:820px){.v{grid-template-columns:1fr;grid-template-rows:minmax(0,58svh) auto;overflow:auto}.v-stage img{max-height:calc(58svh - 32px)}.v-side h2{margin-top:8px}.v-x{position:absolute;top:14px;right:14px;background:var(--paper);padding:10px 14px;border-radius:999px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>

<script>
(function(){
  var $=function(id){return document.getElementById(id)}, C=window.COLLECTIONS, cat, sub, list=[];
  var WA='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3z"/></svg>';
  var HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-7.6-4.6-9.2-9.4C1.7 7.6 3.9 4.3 7.3 4.3c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 3.4 0 5.6 3.3 4.5 6.6-1.6 4.8-9.2 9.4-9.2 9.4z"/></svg>';
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
  function subOf(c,k){return c.subs.filter(function(x){return x[0]===k})[0]}
  function subName(c,k){var s=subOf(c,k);return s?s[1]:''}
  function labelOf(c,it){return c.name+(it[1]?' · '+subName(c,it[1]):'')}
  function thumb(it){return it[2][0].indexOf('img/c/')===0?it[2][0].replace(/-1\.jpg$/,'-t.jpg'):it[2][0]}

  /* favourites: kept in this visitor's browser only */
  var FAV=[]; try{FAV=JSON.parse(localStorage.getItem('hyden-enq')||'[]')}catch(e){}
  function isFav(n){return FAV.some(function(x){return x.n===n})}
  function saveFav(){try{localStorage.setItem('hyden-enq',JSON.stringify(FAV))}catch(e){}
    var n=$('enq-count'); n.textContent=FAV.length; n.hidden=!FAV.length; $('enq-open').classList.toggle('on',!!FAV.length);
    [].forEach.call(document.querySelectorAll('.fav'),function(b){b.setAttribute('aria-pressed',isFav(b.dataset.n))});
    renderFav()}
  function toggleFav(n,c,img){if(isFav(n))FAV=FAV.filter(function(x){return x.n!==n});else FAV.push({n:n,c:c,img:img});saveFav()}
  function renderFav(){
    $('d-list').innerHTML=FAV.length?FAV.map(function(x,i){return '<li><img src="'+x.img+'" alt=""><div><b>'+esc(x.n)+'</b><span>'+esc(x.c)+'</span></div><button type="button" data-i="'+i+'">Remove</button></li>'}).join(''):'<li class="d-empty">No favourites yet.</li>';
    var ask=window.hydenAsk('Hi! I would love to know more about these designs from thehyden.art for my wall:\n'+FAV.map(function(x,i){return (i+1)+'. '+x.n+' ('+x.c+')'}).join('\n'));
    $('d-act').innerHTML=FAV.length?(ask.wa?'<a class="btn wa" href="'+ask.wa+'" target="_blank" rel="noopener">'+WA+'Ask about these on WhatsApp</a>':'')+'<a class="btn ig" href="'+ask.ig+'" target="_blank" rel="noopener">Message on Instagram</a>':'';
  }

  /* category pages */
  function card(it,i,c){
    var lab=labelOf(c,it);
    return '<article class="card" style="animation-delay:'+Math.min(i,10)*.05+'s"><button class="card-o" type="button" data-i="'+i+'"><figure><img src="'+thumb(it)+'" alt="'+esc(it[0])+'" loading="lazy">'+(it[2][1]?'<img class="alt" src="'+it[2][1]+'" alt="" loading="lazy">':'')+'</figure><b>'+esc(it[0])+'</b>'+(it[1]?'<span>'+esc(subName(c,it[1]))+'</span>':'')+'</button>'+
      '<button class="fav" type="button" data-i="'+i+'" data-n="'+esc(it[0])+'" aria-pressed="'+isFav(it[0])+'" aria-label="Save '+esc(it[0])+' to favourites">'+HEART+'</button></article>';
  }
  function route(){
    var h=location.hash.slice(1).split('/');
    cat=C.filter(function(c){return c.key===h[0]})[0]||C[0];
    sub=cat.subs.some(function(s){return s[0]===h[1]})?h[1]:'';
    document.title=cat.name+' · thehyden.art';
    $('c-name').textContent=cat.name; $('c-line').textContent=cat.line;
    $('cats').innerHTML=C.map(function(c){return '<a href="#'+c.key+'"'+(c===cat?' aria-current="page"':'')+'>'+c.name+'</a>'}).join('');
    $('subs').hidden=!cat.subs.length;
    $('subs').innerHTML=cat.subs.length?['<a href="#'+cat.key+'"'+(sub?'':' aria-current="true"')+'>All</a>'].concat(cat.subs.map(function(s){
      return '<a href="#'+cat.key+'/'+s[0]+'"'+(s[0]===sub?' aria-current="true"':'')+'>'+s[1]+(s[2]?'<small>'+s[2]+'</small>':'')+'</a>'})).join(''):'';
    list=cat.items.filter(function(it){return !sub||it[1]===sub});
    $('grid').innerHTML=list.map(function(it,i){return card(it,i,cat)}).join('');
    var a=$('cats').querySelector('[aria-current]'); if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'nearest'});
  }
  $('grid').onclick=function(e){
    var f=e.target.closest('.fav'); if(f){var it=list[+f.dataset.i];toggleFav(it[0],labelOf(cat,it),thumb(it));return}
    var o=e.target.closest('.card-o'); if(o)openV(list[+o.dataset.i],cat)};

  /* favourites drawer */
  var dr=$('d'), dback;
  function openD(){dback=document.activeElement;dr.classList.add('open');document.body.style.overflow='hidden';$('d-x').focus()}
  function closeD(){dr.classList.remove('open');if(!$('v').classList.contains('open'))document.body.style.overflow='';if(dback)dback.focus()}
  $('enq-open').onclick=openD; $('d-x').onclick=closeD; $('d-bg').onclick=closeD;
  $('d-list').onclick=function(e){var b=e.target.closest('button[data-i]');if(!b)return;var x=FAV[+b.dataset.i];toggleFav(x.n,x.c,x.img)};

  /* search across every collection */
  var ALL=[]; C.forEach(function(c){c.items.forEach(function(it){var s=subOf(c,it[1]);
    var extra=Object.keys(window.DESIGNS||{}).map(function(k){var d=window.DESIGNS[k];return d.name===it[0]?d.note+' '+d.te:''}).join(' ');
    ALL.push({it:it,c:c,txt:norm([it[0],c.name,s?s[1]+' '+(s[2]||''):'',extra,(window.KEYWORDS||{})[it[0].replace(/, framed in gold$/,'')]||''].join(' '))})})});
  function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ')}
  var sv=$('s'), sin=$('s-in'), sres=$('s-res'), shits=[], sback;
  function runSearch(){
    var q=norm(sin.value).trim();
    if(!q){sres.innerHTML='<div class="s-cats">'+C.map(function(c){return '<a href="#'+c.key+'" data-close>'+c.name+'</a>'}).join('')+'</div>';shits=[];return}
    var words=q.split(/\s+/);
    shits=ALL.filter(function(x){return words.every(function(w){return x.txt.indexOf(w)>-1})});
    sres.innerHTML=shits.length?'<p>'+shits.length+(shits.length===1?' design':' designs')+'</p><div class="s-grid">'+shits.map(function(x,i){
      return '<button type="button" data-i="'+i+'"><figure><img src="'+thumb(x.it)+'" alt="" loading="lazy"></figure><div><b>'+esc(x.it[0])+'</b><span>'+esc(labelOf(x.c,x.it))+'</span></div></button>'}).join('')+'</div>'
      :'<p>No designs match “'+esc(sin.value.trim())+'”.</p>';
  }
  function openS(){if(sv.classList.contains('open')){closeS();return}sback=document.activeElement;sv.classList.add('open');runSearch();setTimeout(function(){sin.focus()},50)}
  function closeS(){sv.classList.remove('open')}
  document.addEventListener('pointerdown',function(e){if(sv.classList.contains('open')&&!sv.contains(e.target)&&!e.target.closest('#s-open'))closeS()},true);
  $('s-open').onclick=openS; $('s-x').onclick=closeS; sin.oninput=runSearch;
  sres.onclick=function(e){
    if(e.target.closest('[data-close]')){closeS();return}
    var b=e.target.closest('button[data-i]'); if(!b)return; var x=shits[+b.dataset.i];
    closeS(); if(location.hash!=='#'+x.c.key)location.hash=x.c.key; route(); openV(x.it,x.c)};
  sin.onkeydown=function(e){if(e.key==='Enter'&&shits[0]){var x=shits[0];closeS();if(location.hash!=='#'+x.c.key)location.hash=x.c.key;route();openV(x.it,x.c)}};

  /* design viewer */
  var v=$('v'), cur, at=0, back;
  function showImg(i){at=(i+cur[2].length)%cur[2].length;$('v-img').src=cur[2][at];$('v-img').alt=cur[0]+', photo '+(at+1);
    [].forEach.call($('v-thumbs').children,function(b,j){b.setAttribute('aria-pressed',j===at)})}
  function openV(it,c){
    cur=it; back=document.activeElement;
    var label=labelOf(c,it);
    $('v-kick').textContent=label; $('v-name').textContent=it[0];
    $('v-thumbs').innerHTML=it[2].length>1?it[2].map(function(s,j){return '<button type="button" aria-label="Photo '+(j+1)+'"><img src="'+s+'" alt=""></button>'}).join(''):'';
    [].forEach.call($('v-thumbs').children,function(b,j){b.onclick=function(){showImg(j)}});
    var multi=it[2].length>1; [].forEach.call(v.querySelectorAll('.v-nav'),function(b){b.hidden=!multi});
    var ask=window.hydenAsk('Hi! I would love to know more about "'+it[0]+'" ('+label+') from thehyden.art for my wall.');
    $('v-act').innerHTML=(ask.wa?'<a class="btn wa" href="'+ask.wa+'" target="_blank" rel="noopener">'+WA+'Ask on WhatsApp</a>':'')+
      '<a class="btn ig" href="'+ask.ig+'" target="_blank" rel="noopener">Message on Instagram</a>'+
      '<button class="btn add" type="button" id="v-add"></button>'+(it[3]?'<a class="v-ig" href="https://www.instagram.com/'+it[3]+'/" target="_blank" rel="noopener">See the post</a>':'');
    var add=$('v-add'); function addLabel(){var on=isFav(it[0]);add.textContent=on?'♥ Saved to favourites':'♡ Save to favourites';add.classList.toggle('on',on)}
    add.onclick=function(){toggleFav(it[0],label,thumb(it));addLabel()}; addLabel();
    showImg(0); v.classList.add('open'); document.body.style.overflow='hidden'; $('v-x').focus();
  }
  function closeV(){v.classList.remove('open');document.body.style.overflow='';if(back)back.focus()}
  $('v-x').onclick=closeV; v.querySelector('.v-prev').onclick=function(){showImg(at-1)}; v.querySelector('.v-next').onclick=function(){showImg(at+1)};

  addEventListener('keydown',function(e){
    if(e.key==='Escape'){if(sv.classList.contains('open'))closeS();else if(v.classList.contains('open'))closeV();else if(dr.classList.contains('open'))closeD();return}
    if(v.classList.contains('open')){if(e.key==='ArrowLeft')showImg(at-1);if(e.key==='ArrowRight')showImg(at+1)}
    if(e.key==='/'&&!sv.classList.contains('open')&&document.activeElement.tagName!=='INPUT'){e.preventDefault();openS()}});

  addEventListener('hashchange',function(){route();scrollTo(0,0)}); route(); saveFav();
  var op=new URLSearchParams(location.search).get('open'); if(op==='search')openS(); if(op==='favourites')openD();

  var sheet=$('sheet');
  $('menu').onclick=function(){sheet.classList.add('open');this.setAttribute('aria-expanded','true')};
  $('x').onclick=function(){sheet.classList.remove('open');$('menu').setAttribute('aria-expanded','false')};
  [].forEach.call(sheet.querySelectorAll('a'),function(a){a.onclick=function(){sheet.classList.remove('open')}});
  $('yr').textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
